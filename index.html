<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas - Canchas Deportivas</title>
    <!-- Librería SheetJS para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .main-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 20px;
            width: 100%;
            max-width: 980px;
        }
        @media (max-width: 820px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }
        .app-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo-container {
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-container img {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }
        .header h1 {
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
        }
        .form-control {
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .date-nav-bar {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }
        .btn-nav {
            flex: 1;
            padding: 6px 8px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-nav:hover {
            background-color: #e2e8f0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 6px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #ffffff;
            transition: opacity 0.2s;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #2563eb;
        }
        .btn-success {
            background-color: #059669;
        }
        .btn:hover:not(:disabled) {
            opacity: 0.95;
        }
        .status-msg {
            font-size: 0.85rem;
            text-align: center;
            padding: 9px;
            border-radius: 6px;
            display: none;
            line-height: 1.4;
        }
        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }
        .status-ok {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }
        .cloud-badge {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }
        /* Panel de Disponibilidad */
        .schedule-header {
            background-color: #334155;
            color: #ffffff;
            padding: 14px 16px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-header button {
            background: #475569;
            border: none;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .schedule-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 490px;
            overflow-y: auto;
        }
        .slot-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            border: 1px solid #e2e8f0;
        }
        .slot-libre {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }
        .slot-ocupado {
            background-color: #fef2f2;
            border-color: #fecaca;
        }
        .badge-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 5px;
            font-weight: 700;
            font-size: 0.75rem;
        }
        .badge-libre {
            background-color: #dcfce7;
            color: #166534;
        }
        .badge-ocupado {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .btn-delete-slot {
            background-color: #dc2626;
            color: #ffffff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s;
        }
        .btn-delete-slot:hover {
            background-color: #b91c1c;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- PANEL 1: FORMULARIO -->
    <div class="app-card">
        <div class="header">
            <div class="logo-container">
                <img src="img/cancha.png" alt="Logo">
            </div>
            <h1>Reservas de Canchas</h1>
        </div>

        <div class="form-body">
            <div id="statusAlert" class="status-msg"></div>

            <div class="form-group">
                <label for="txtFecha">Fecha a Consultar / Reservar:</label>
                <input type="date" id="txtFecha" class="form-control" onchange="cambiarFechaManual()">
                <div class="date-nav-bar">
                    <button class="btn-nav" onclick="navegarDias(-1)">◀ Anterior</button>
                    <button class="btn-nav" onclick="irAHoy()">Hoy</button>
                    <button class="btn-nav" onclick="navegarDias(1)">Siguiente ▶</button>
                    <button class="btn-nav" onclick="navegarDias(2)">+2 Días</button>
                </div>
            </div>

            <div class="form-group">
                <label for="cboCancha">Cancha:</label>
                <select id="cboCancha" class="form-control" onchange="renderizarPanelDisponibilidad()">
                    <option value="Cancha 1">Cancha La Esmeralda</option>
                    <option value="Cancha 2">Cancha San Francisco</option>
                    <option value="Cancha Sintética">Cancha Coatepeque</option>
                </select>
            </div>

            <div class="time-row">
                <div class="form-group">
                    <label for="txtHoraInicio">Desde (Inicio):</label>
                    <input type="time" id="txtHoraInicio" class="form-control" onchange="verificarCruceEnVivo()">
                </div>
                <div class="form-group">
                    <label for="txtHoraFin">Hasta (Fin):</label>
                    <input type="time" id="txtHoraFin" class="form-control" onchange="verificarCruceEnVivo()">
                </div>
            </div>

            <div class="form-group">
                <label for="txtNombre">Nombre del Cliente:</label>
                <input type="text" id="txtNombre" class="form-control" placeholder="Ej. Juan Pérez">
            </div>

            <div class="cloud-badge" id="lblSyncStatus">⏳ Conectando con Google Drive...</div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnGuardar" onclick="guardarEnGoogleDrive()">☁ Guardar Reserva</button>
                <button class="btn btn-success" onclick="descargarReporteExcel()">📥 Descargar Reporte en Excel (.xlsx)</button>
            </div>
        </div>
    </div>

    <!-- PANEL 2: DISPONIBILIDAD -->
    <div class="app-card">
        <div class="schedule-header">
            <span id="lblTituloHorario">Disponibilidad de Horarios</span>
            <button onclick="consultarDisponibilidadNube()">🔄 Actualizar</button>
        </div>
        <div class="schedule-body" id="contenedorHorarios">
            <!-- Se actualiza con opciones de eliminación -->
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxSLSG0ep19ZPRPia86wN1UzltgWLqWTDgwMPYNZalplA3o7TZhp6EDpl23tq16oxqW5w/exec";

    let reservasNube = JSON.parse(localStorage.getItem('reservas_canchas_nube')) || [];

    const inputFecha = document.getElementById('txtFecha');
    inputFecha.valueAsDate = new Date();

    const turnosBase = [
        { ini: "06:00", fin: "07:00" }, { ini: "07:00", fin: "08:00" },
        { ini: "08:00", fin: "09:00" }, { ini: "09:00", fin: "10:00" },
        { ini: "10:00", fin: "11:00" }, { ini: "11:00", fin: "12:00" },
        { ini: "12:00", fin: "13:00" }, { ini: "13:00", fin: "14:00" },
        { ini: "14:00", fin: "15:00" }, { ini: "15:00", fin: "16:00" },
        { ini: "16:00", fin: "17:00" }, { ini: "17:00", fin: "18:00" },
        { ini: "18:00", fin: "19:00" }, { ini: "19:00", fin: "20:00" },
        { ini: "20:00", fin: "21:00" }, { ini: "21:00", fin: "22:00" }
    ];

    function formatearFecha(fechaISO) {
        if (!fechaISO) return "";
        const partes = fechaISO.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function navegarDias(delta) {
        let fechaActual = new Date(inputFecha.value + "T00:00:00");
        fechaActual.setDate(fechaActual.getDate() + delta);
        inputFecha.value = fechaActual.toISOString().split('T')[0];
        renderizarPanelDisponibilidad();
        verificarCruceEnVivo();
    }

    function irAHoy() {
        inputFecha.valueAsDate = new Date();
        renderizarPanelDisponibilidad();
        verificarCruceEnVivo();
    }

    function cambiarFechaManual() {
        renderizarPanelDisponibilidad();
        verificarCruceEnVivo();
    }

    function mostrarMensaje(texto, tipo) {
        const alertBox = document.getElementById('statusAlert');
        alertBox.innerHTML = texto;
        alertBox.className = "status-msg " + (tipo === "ok" ? "status-ok" : "status-error");
    }

    async function consultarDisponibilidadNube() {
        const statusLabel = document.getElementById('lblSyncStatus');
        statusLabel.textContent = "⏳ Sincronizando con Google Drive...";

        try {
            const resp = await fetch(API_URL, {
                method: "GET",
                redirect: "follow"
            });

            const data = await resp.json();
            
            if (Array.isArray(data)) {
                reservasNube = data;
                localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
                statusLabel.textContent = `🟢 Conectado con Google Drive (${reservasNube.length} reservas registradas)`;
            } else {
                statusLabel.textContent = "🟢 Conectado con Google Drive";
            }
        } catch (e) {
            console.warn("Consulta inicial:", e);
            reservasNube = JSON.parse(localStorage.getItem('reservas_canchas_nube')) || [];
            statusLabel.textContent = `🟢 Conectado con Google Drive (${reservasNube.length} reservas en memoria)`;
        }
        
        renderizarPanelDisponibilidad();
    }

    function renderizarPanelDisponibilidad() {
        const fecha = formatearFecha(inputFecha.value);
        const cancha = document.getElementById('cboCancha').value;
        const contenedor = document.getElementById('contenedorHorarios');
        const titulo = document.getElementById('lblTituloHorario');

        titulo.textContent = `📅 ${fecha} | ${cancha}`;
        contenedor.innerHTML = "";

        turnosBase.forEach(turno => {
            const reserva = reservasNube.find(r => 
                r.Fecha === fecha &&
                r.Cancha.toUpperCase() === cancha.toUpperCase() &&
                (turno.ini < r.HoraFin && turno.fin > r.HoraInicio)
            );

            const card = document.createElement('div');
            if (reserva) {
                card.className = "slot-card slot-ocupado";
                card.innerHTML = `
                    <div>
                        <strong>${turno.ini} - ${turno.fin}</strong>
                        <div style="font-size:0.75rem; color:#b91c1c;">Reservado por: <b>${reserva.Nombre}</b></div>
                    </div>
                    <div class="badge-actions">
                        <span class="badge badge-ocupado">Ocupado</span>
                        <button class="btn-delete-slot" onclick="eliminarReserva('${reserva.Fecha}', '${reserva.Cancha}', '${reserva.HoraInicio}', '${reserva.Nombre}')">✕ Cancelar</button>
                    </div>
                `;
            } else {
                card.className = "slot-card slot-libre";
                card.innerHTML = `
                    <div>
                        <strong>${turno.ini} - ${turno.fin}</strong>
                        <div style="font-size:0.75rem; color:#15803d;">Disponible</div>
                    </div>
                    <span class="badge badge-libre">Libre</span>
                `;
            }
            contenedor.appendChild(card);
        });
    }

    function verificarCruceEnVivo() {
        const fecha = formatearFecha(inputFecha.value);
        const horaInicio = document.getElementById('txtHoraInicio').value;
        const horaFin = document.getElementById('txtHoraFin').value;
        const cancha = document.getElementById('cboCancha').value;

        if (!fecha || !horaInicio || !horaFin || !cancha) return;

        if (horaInicio >= horaFin) {
            mostrarMensaje("⚠️ La hora final debe ser mayor a la hora inicial.", "error");
            return;
        }

        const conflicto = reservasNube.find(r => 
            r.Fecha === fecha &&
            r.Cancha.toUpperCase() === cancha.toUpperCase() &&
            (horaInicio < r.HoraFin && horaFin > r.HoraInicio)
        );

        if (conflicto) {
            mostrarMensaje(`⛔ <strong>Horario Ocupado en fecha ${fecha}:</strong> ${conflicto.HoraInicio} a ${conflicto.HoraFin} por <strong>${conflicto.Nombre}</strong>.`, "error");
        } else {
            document.getElementById('statusAlert').style.display = "none";
        }
    }

    async function guardarEnGoogleDrive() {
        const fecha = formatearFecha(inputFecha.value);
        const horaInicio = document.getElementById('txtHoraInicio').value;
        const horaFin = document.getElementById('txtHoraFin').value;
        const nombre = document.getElementById('txtNombre').value.trim();
        const cancha = document.getElementById('cboCancha').value;
        const btn = document.getElementById('btnGuardar');

        if (!fecha || !horaInicio || !horaFin || !nombre || !cancha) {
            mostrarMensaje("Por favor completa todos los campos.", "error");
            return;
        }

        if (horaInicio >= horaFin) {
            mostrarMensaje("La hora final debe ser mayor que la de inicio.", "error");
            return;
        }

        const conflicto = reservasNube.find(r => 
            r.Fecha === fecha &&
            r.Cancha.toUpperCase() === cancha.toUpperCase() &&
            (horaInicio < r.HoraFin && horaFin > r.HoraInicio)
        );

        if (conflicto) {
            mostrarMensaje(`⛔ Horario no disponible para el día ${fecha}.`, "error");
            return;
        }

        const nuevaReserva = {
            Fecha: fecha,
            HoraInicio: horaInicio,
            HoraFin: horaFin,
            Horario: `${horaInicio} a ${horaFin}`,
            Nombre: nombre,
            Cancha: cancha,
            Estado: "Confirmada"
        };

        btn.disabled = true;
        btn.textContent = "Guardando en Drive...";

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(nuevaReserva)
            });

            reservasNube.push(nuevaReserva);
            localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
            renderizarPanelDisponibilidad();

            document.getElementById('txtHoraInicio').value = '';
            document.getElementById('txtHoraFin').value = '';
            document.getElementById('txtNombre').value = '';

            mostrarMensaje(`¡Reserva para el día <strong>${fecha}</strong> guardada con éxito!`, "ok");
        } catch (e) {
            mostrarMensaje("Error al enviar los datos a Google Sheets.", "error");
        } finally {
            btn.disabled = false;
            btn.textContent = "☁ Guardar Reserva";
            consultarDisponibilidadNube();
        }
    }

    // ELIMINAR RESERVA DE DRIVE Y DEL PANEL
    async function eliminarReserva(fecha, cancha, horaInicio, nombre) {
        const confirmar = confirm(`¿Estás seguro de que deseas cancelar la reserva de "${nombre}" el ${fecha} (${cancha})?`);
        if (!confirmar) return;

        mostrarMensaje("Cancelando reserva en Google Drive...", "ok");

        const payload = {
            accion: "eliminar",
            Fecha: fecha,
            Cancha: cancha,
            HoraInicio: horaInicio
        };

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            // Eliminar del arreglo local
            reservasNube = reservasNube.filter(r => !(
                r.Fecha === fecha && 
                r.Cancha.toUpperCase() === cancha.toUpperCase() && 
                r.HoraInicio === horaInicio
            ));
            
            localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
            renderizarPanelDisponibilidad();
            mostrarMensaje("¡Reserva eliminada con éxito de Google Sheets!", "ok");
        } catch (e) {
            mostrarMensaje("Error al eliminar la reserva.", "error");
        } finally {
            consultarDisponibilidadNube();
        }
    }

    function descargarReporteExcel() {
        if (reservasNube.length === 0) {
            mostrarMensaje("No hay datos para exportar.", "error");
            return;
        }

        const ordenadas = [...reservasNube].sort((a, b) => {
            const fA = a.Fecha.split('/').reverse().join('') + a.HoraInicio;
            const fB = b.Fecha.split('/').reverse().join('') + b.HoraInicio;
            return fA.localeCompare(fB);
        });

        const reporteData = [["PANEL DE CONTROL - REPORTES MULTI-DÍA"], []];
        const fechasUnicas = [...new Set(ordenadas.map(r => r.Fecha))];

        fechasUnicas.forEach(f => {
            reporteData.push([`📅 FECHA: ${f}`]);
            reporteData.push(["Horario", "Cliente", "Cancha", "Estado"]);
            ordenadas.filter(r => r.Fecha === f).forEach(r => {
                reporteData.push([r.Horario, r.Nombre, r.Cancha, r.Estado || "Confirmada"]);
            });
            reporteData.push([]);
        });

        const wsRep = XLSX.utils.aoa_to_sheet(reporteData);
        wsRep['!cols'] = [{ wch: 18 }, { wch: 28 }, { wch: 20 }, { wch: 14 }];

        const wsBD = XLSX.utils.json_to_sheet(ordenadas);

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsRep, "Reporte_General");
        XLSX.utils.book_append_sheet(wb, wsBD, "BaseDatos");

        XLSX.writeFile(wb, "Reporte_Reservas_MultiDia.xlsx");
        mostrarMensaje("Archivo Excel descargado exitosamente.", "ok");
    }

    consultarDisponibilidadNube();
</script>

</body>
</html>
