<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas - Canchas Deportivas</title>
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }
        .main-wrapper {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        @media (max-width: 950px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }
        .app-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo-container {
            width: 55px;
            height: 55px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-container img {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }
        .header h1 {
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }
        .form-control {
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
            background-color: #ffffff;
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .date-nav-bar {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .btn-nav {
            flex: 1;
            padding: 7px 4px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }
        .btn-nav:hover {
            background-color: #e2e8f0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            color: #ffffff;
            transition: opacity 0.2s;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary { background-color: #2563eb; }
        .btn-success { background-color: #059669; }
        .status-msg {
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            display: none;
            line-height: 1.4;
        }
        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1.5px solid #f87171;
            display: block;
        }
        .status-ok {
            background-color: #dcfce7;
            color: #166534;
            border: 1.5px solid #86efac;
            display: block;
        }
        .cloud-badge {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }

        /* Panel Comparativo Multi-Cancha */
        .schedule-header {
            background-color: #334155;
            color: #ffffff;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-header button {
            background: #475569;
            border: none;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .grid-canchas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            padding: 16px;
            background: #f8fafc;
            max-height: 560px;
            overflow-y: auto;
        }
        .cancha-column {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cancha-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .slot-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #e2e8f0;
        }
        .slot-libre {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }
        .slot-ocupado {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        .slot-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .btn-cancel {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 4px;
            align-self: flex-start;
        }
        .btn-cancel:hover {
            background: #dc2626;
        }

        /* Modal Alerta */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 12px;
            max-width: 380px;
            width: 100%;
            padding: 22px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border-top: 6px solid #dc2626;
        }
        .modal-box h3 {
            color: #991b1b;
            font-size: 1.15rem;
            margin-bottom: 10px;
        }
        .modal-box p {
            font-size: 0.9rem;
            color: #334155;
            line-height: 1.5;
            margin-bottom: 18px;
            text-align: left;
            background: #fef2f2;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fecaca;
        }
        .modal-btn {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>

<!-- Formulario oculto de envío seguro -->
<iframe name="iframe_oculto" id="iframe_oculto" style="display:none;"></iframe>
<form id="form_envio_nube" method="GET" target="iframe_oculto" style="display:none;"></form>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyiPbwISGAl-rO-nNi3H-iNlioDhYfHVRBL6SIfNZLsS_R4Fo19ke_h6HUbPCzd-hH48A/exec";

    const canchasDisponibles = ["Cancha La Esmeralda", "Cancha San Francisco", "Cancha Coatepeque"];

    const horasBase = [
        "06:00", "07:00", "08:00", "09:00", "10:00", "11:00",
        "12:00", "13:00", "14:00", "15:00", "16:00", "17:00",
        "18:00", "19:00", "20:00", "21:00", "22:00"
    ];

    let reservasNube = [];

    const inputFecha = document.getElementById('txtFecha');

    function obtenerFechaLocalISO(d = new Date()) {
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    inputFecha.value = obtenerFechaLocalISO();

    function normalizarAClaveFecha(fechaEntrada) {
        if (!fechaEntrada) return "";
        let str = fechaEntrada.toString().trim();
        if (str.includes("T")) str = str.split("T")[0];
        if (str.includes("/")) {
            const p = str.split("/");
            if (p.length === 3) {
                return `${p[2].length === 2 ? '20' + p[2] : p[2]}-${p[1].padStart(2, '0')}-${p[0].padStart(2, '0')}`;
            }
        }
        if (str.includes("-")) {
            const p = str.split("-");
            if (p.length === 3) return `${p[0]}-${p[1].padStart(2, '0')}-${p[2].padStart(2, '0')}`;
        }
        return str;
    }

    function formatearFechaVisual(claveFecha) {
        if (!claveFecha) return "";
        const p = claveFecha.split("-");
        if (p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;
        return claveFecha;
    }

    function aFormato24H(horaStr) {
        if (!horaStr) return "";
        let str = horaStr.toString().trim().toUpperCase();
        if (str.includes("AM") || str.includes("PM")) {
            const esPM = str.includes("PM");
            const limpia = str.replace("AM", "").replace("PM", "").trim();
            const partes = limpia.split(":");
            let h = parseInt(partes[0], 10);
            const m = partes[1] ? partes[1].substring(0, 2) : "00";
            if (esPM && h < 12) h += 12;
            if (!esPM && h === 12) h = 0;
            return `${h.toString().padStart(2, "0")}:${m.padStart(2, "0")}`;
        }
        if (str.includes("T")) str = str.split("T")[1].substring(0, 5);
        const partes = str.split(":");
        if (partes.length >= 2) {
            return `${partes[0].padStart(2, "0")}:${partes[1].substring(0, 2).padStart(2, "0")}`;
        }
        return str;
    }

    function aFormato12H(hora24) {
        if (!hora24) return "";
        const h24 = aFormato24H(hora24);
        const partes = h24.split(":");
        if (partes.length >= 2) {
            let h = parseInt(partes[0], 10);
            const m = partes[1];
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12;
            h = h ? h : 12;
            return `${h.toString().padStart(2, "0")}:${m} ${ampm}`;
        }
        return hora24;
    }

    function inicializarSelectoresHora() {
        const cboIni = document.getElementById('cboHoraInicio');
        const cboFin = document.getElementById('cboHoraFin');
        cboIni.innerHTML = '<option value="">-- Inicio --</option>';
        cboFin.innerHTML = '<option value="">-- Fin --</option>';

        horasBase.forEach((h, index) => {
            if (index < horasBase.length - 1) {
                const optIni = document.createElement('option');
                optIni.value = h;
                optIni.textContent = aFormato12H(h);
                cboIni.appendChild(optIni);
            }
            if (index > 0) {
                const optFin = document.createElement('option');
                optFin.value = h;
                optFin.textContent = aFormato12H(h);
                cboFin.appendChild(optFin);
            }
        });
    }

    function mostrarModalAlerta(cancha, fecha, horario, nombre) {
        const modal = document.getElementById('modalConflicto');
        const txt = document.getElementById('modalTextoDetalle');
        txt.innerHTML = `
            📍 <b>Cancha:</b> ${cancha}<br>
            📅 <b>Fecha:</b> ${fecha}<br>
            ⏰ <b>Horario:</b> ${horario}<br>
            👤 <b>Reservado por:</b> ${nombre}
        `;
        modal.style.display = "flex";
    }

    function cerrarModal() {
        document.getElementById('modalConflicto').style.display = "none";
    }

    function navegarDias(delta) {
        const [y, m, d] = inputFecha.value.split('-').map(Number);
        const f = new Date(y, m - 1, d);
        f.setDate(f.getDate() + delta);
        inputFecha.value = obtenerFechaLocalISO(f);
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function irAHoy() {
        inputFecha.value = obtenerFechaLocalISO();
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function cambiarFechaManual() {
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function mostrarMensaje(texto, tipo) {
        const box = document.getElementById('statusAlert');
        box.innerHTML = texto;
        box.className = "status-msg " + (tipo === "ok" ? "status-ok" : "status-error");
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function consultarDisponibilidadNube() {
        const lbl = document.getElementById('lblSyncStatus');
        try {
            const resp = await fetch(`${API_URL}?_nocache=${Date.now()}`, { 
                method: "GET", 
                redirect: "follow" 
            });
            const data = await resp.json();
            if (Array.isArray(data)) {
                reservasNube = data.map(r => {
                    const claveF = normalizarAClaveFecha(r.Fecha);
                    const hIni = aFormato24H(r.HoraInicio);
                    const hFin = aFormato24H(r.HoraFin);
                    return {
                        ClaveFecha: claveF,
                        Fecha: formatearFechaVisual(claveF),
                        HoraInicio: hIni,
                        HoraFin: hFin,
                        Horario: `${aFormato12H(hIni)} a ${aFormato12H(hFin)}`,
                        Nombre: r.Nombre || "",
                        Cancha: (r.Cancha || "").trim(),
                        Estado: r.Estado || "Confirmada"
                    };
                });
                lbl.textContent = `🟢 Conectado (${reservasNube.length} reservas registradas)`;
            }
        } catch (e) {
            lbl.textContent = `🟢 Conectado con Google Drive (${reservasNube.length} reservas)`;
        }
        renderizarTablasMultiCancha();
    }

    function buscarConflicto(claveFecha, cancha, hIni, hFin) {
        return reservasNube.find(r => {
            const matchFecha = (r.ClaveFecha === claveFecha || normalizarAClaveFecha(r.Fecha) === claveFecha);
            const matchCancha = (r.Cancha.toUpperCase() === cancha.toUpperCase());
            if (matchFecha && matchCancha) {
                const rIni = aFormato24H(r.HoraInicio);
                const rFin = aFormato24H(r.HoraFin);
                return (hIni < rFin && hFin > rIni);
            }
            return false;
        });
    }

    function renderizarTablasMultiCancha() {
        const claveFecha = normalizarAClaveFecha(inputFecha.value);
        const fechaVisual = formatearFechaVisual(claveFecha);
        const cont = document.getElementById('contenedorMultiCancha');
        document.getElementById('lblTituloHorario').textContent = `📅 Horarios: ${fechaVisual}`;
        cont.innerHTML = "";

        canchasDisponibles.forEach(cancha => {
            const col = document.createElement('div');
            col.className = "cancha-column";
            col.innerHTML = `<div class="cancha-title">🏟️ ${cancha}</div>`;

            for (let i = 0; i < horasBase.length - 1; i++) {
                const tIni = horasBase[i];
                const tFin = horasBase[i + 1];

                const res = buscarConflicto(claveFecha, cancha, tIni, tFin);

                const item = document.createElement('div');
                if (res) {
                    item.className = "slot-item slot-ocupado";
                    item.innerHTML = `
                        <div class="slot-header-row">
                            <span><b>${aFormato12H(tIni)} - ${aFormato12H(tFin)}</b></span>
                            <span>🔴 Ocupado</span>
                        </div>
                        <div>Cliente: <b>${res.Nombre}</b></div>
                        <button class="btn-cancel" onclick="eliminarReserva('${res.ClaveFecha}', '${res.Cancha}', '${res.HoraInicio}', '${res.Nombre}')">✕ Cancelar</button>
                    `;
                } else {
                    item.className = "slot-item slot-libre";
                    item.innerHTML = `
                        <div class="slot-header-row">
                            <span>${aFormato12H(tIni)} - ${aFormato12H(tFin)}</span>
                            <span>🟢 Libre</span>
                        </div>
                    `;
                }
                col.appendChild(item);
            }

            cont.appendChild(col);
        });
    }

    function verificarCruceEnVivo() {
        const claveFecha = normalizarAClaveFecha(inputFecha.value);
        const horaInicio = aFormato24H(document.getElementById('cboHoraInicio').value);
        const horaFin = aFormato24H(document.getElementById('cboHoraFin').value);
        const cancha = document.getElementById('cboCancha').value;

        if (!claveFecha || !horaInicio || !horaFin || !cancha) return false;

        if (horaInicio >= horaFin) {
            mostrarMensaje("⚠️ La hora final debe ser posterior a la hora de inicio.", "error");
            return false;
        }

        const conflicto = buscarConflicto(claveFecha, cancha, horaInicio, horaFin);

        if (conflicto) {
            const hConflict12 = `${aFormato12H(conflicto.HoraInicio)} a ${aFormato12H(conflicto.HoraFin)}`;
            mostrarMensaje(`⛔ <strong>${cancha}</strong> YA ESTÁ RESERVADA de ${hConflict12} por <strong>${conflicto.Nombre}</strong>.`, "error");
            return true;
        } else {
            document.getElementById('statusAlert').style.display = "none";
            return false;
        }
    }

    function enviarDatosNube(objetoParametros) {
        const form = document.getElementById('form_envio_nube');
        form.action = API_URL;
        form.innerHTML = "";
        
        for (const [key, value] of Object.entries(objetoParametros)) {
            const input = document.createElement('input');
            input.type = "hidden";
            input.name = key;
            input.value = value;
            form.appendChild(input);
        }
        form.submit();
    }

    async function guardarEnGoogleDrive() {
        const claveFecha = normalizarAClaveFecha(inputFecha.value);
        const fechaVisual = formatearFechaVisual(claveFecha);
        const horaInicio = aFormato24H(document.getElementById('cboHoraInicio').value);
        const horaFin = aFormato24H(document.getElementById('cboHoraFin').value);
        const nombre = document.getElementById('txtNombre').value.trim();
        const cancha = document.getElementById('cboCancha').value;
        const btn = document.getElementById('btnGuardar');

        if (!claveFecha || !horaInicio || !horaFin || !nombre || !cancha) {
            mostrarMensaje("⚠️ Por favor completa todos los campos requeridos.", "error");
            return;
        }

        if (horaInicio >= horaFin) {
            mostrarMensaje("⚠️ La hora final debe ser mayor que la hora inicial.", "error");
            return;
        }

        const conflicto = buscarConflicto(claveFecha, cancha, horaInicio, horaFin);
        if (conflicto) {
            const hConflict12 = `${aFormato12H(conflicto.HoraInicio)} a ${aFormato12H(conflicto.HoraFin)}`;
            mostrarMensaje(`⛔ <strong>${cancha}</strong> ya está reservada de ${hConflict12} por <strong>${conflicto.Nombre}</strong>.`, "error");
            mostrarModalAlerta(cancha, fechaVisual, hConflict12, conflicto.Nombre);
            return;
        }

        const horario12H = `${aFormato12H(horaInicio)} a ${aFormato12H(horaFin)}`;

        btn.disabled = true;
        btn.textContent = "⏳ Guardando en Google Drive...";

        enviarDatosNube({
            accion: "guardar",
            Fecha: fechaVisual,
            HoraInicio: aFormato12H(horaInicio),
            HoraFin: aFormato12H(horaFin),
            Horario: horario12H,
            Nombre: nombre,
            Cancha: cancha,
            _t: Date.now()
        });

        document.getElementById('cboHoraInicio').value = '';
        document.getElementById('cboHoraFin').value = '';
        document.getElementById('txtNombre').value = '';

        mostrarMensaje(`¡Reserva confirmada en <strong>${cancha}</strong> (${horario12H})!`, "ok");
        btn.disabled = false;
        btn.textContent = "☁ Guardar Reserva";

        setTimeout(consultarDisponibilidadNube, 1500);
        setTimeout(consultarDisponibilidadNube, 3500);
    }

    async function eliminarReserva(claveFecha, cancha, horaInicio, nombre) {
        const fechaVisual = formatearFechaVisual(claveFecha);
        const hora12H = aFormato12H(horaInicio);
        
        if (!confirm(`¿Cancelar la reserva de "${nombre}" en ${cancha} (${fechaVisual} a las ${hora12H})?`)) return;

        enviarDatosNube({
            accion: "eliminar",
            Fecha: fechaVisual,
            Cancha: cancha,
            HoraInicio: aFormato24H(horaInicio),
            _t: Date.now()
        });

        mostrarMensaje("Reserva cancelada con éxito.", "ok");
        setTimeout(consultarDisponibilidadNube, 1500);
        setTimeout(consultarDisponibilidadNube, 3500);
    }

    // ==========================================
    // REPORTE EXCEL MEJORADO Y PROFESIONAL
    // ==========================================
    function descargarReporteExcel() {
        if (reservasNube.length === 0) {
            mostrarMensaje("⚠️ No hay reservas registradas para exportar.", "error");
            return;
        }

        const ahora = new Date();
        const fechaEmision = ahora.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
        const horaEmision = ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: true });

        // Ordenar cronológicamente
        const ordenadas = [...reservasNube].sort((a, b) => {
            const fA = a.ClaveFecha + a.Cancha + aFormato24H(a.HoraInicio);
            const fB = b.ClaveFecha + b.Cancha + aFormato24H(b.HoraInicio);
            return fA.localeCompare(fB);
        });

        // ---------------------------------------------------------
        // HOJA 1: REPORTE EJECUTIVO POR CANCHA CON KPIs
        // ---------------------------------------------------------
        const hojaEjecutiva = [
            ["SISTEMA DE GESTIÓN Y RESERVA DE CANCHAS DEPORTIVAS"],
            ["REPORTE EJECUTIVO CONSOLIDADO"],
            [`Emitido el: ${fechaEmision} a las ${horaEmision}`, "", "", "", `Total Reservas Activas: ${ordenadas.length}`],
            [],
            ["RESUMEN POR SEDE / CANCHA"],
            ["Cancha / Espacio Deportivo", "Total Reservas", "Estado del Espacio"]
        ];

        canchasDisponibles.forEach(c => {
            const cant = ordenadas.filter(r => r.Cancha === c).length;
            hojaEjecutiva.push([c, cant, cant > 0 ? "Activo con Reservas" : "Disponible (Sin reservas)"]);
        });

        hojaEjecutiva.push([], ["DETALLE AGRUPADO POR CANCHA"]);

        canchasDisponibles.forEach(cancha => {
            const resCancha = ordenadas.filter(r => r.Cancha === cancha);
            hojaEjecutiva.push([]);
            hojaEjecutiva.push([`🏟️ ESPACIO: ${cancha.toUpperCase()} (${resCancha.length} Reservas Registradas)`]);
            hojaEjecutiva.push(["#", "Fecha", "Horario (12 Horas)", "Cliente Titular", "Estado de la Reserva"]);

            if (resCancha.length === 0) {
                hojaEjecutiva.push(["-", "Sin registros", "-", "-", "Sin reservas programadas"]);
            } else {
                resCancha.forEach((r, idx) => {
                    const horario12 = `${aFormato12H(aFormato24H(r.HoraInicio))} a ${aFormato12H(aFormato24H(r.HoraFin))}`;
                    hojaEjecutiva.push([idx + 1, r.Fecha, horario12, r.Nombre, r.Estado || "Confirmada"]);
                });
            }
        });

        const wsEjecutivo = XLSX.utils.aoa_to_sheet(hojaEjecutiva);
        wsEjecutivo['!cols'] = [
            { wch: 6 },   // #
            { wch: 16 },  // Fecha
            { wch: 24 },  // Horario
            { wch: 32 },  // Cliente
            { wch: 22 }   // Estado
        ];

        // ---------------------------------------------------------
        // HOJA 2: CRONOGRAMA MAESTRO GENERAL
        // ---------------------------------------------------------
        const hojaCronograma = [
            ["CRONOGRAMA GENERAL CONSOLIDADO - TODAS LAS SEDES"],
            [`Actualizado al: ${fechaEmision} ${horaEmision}`],
            [],
            ["ID", "Fecha", "Cancha / Sede", "Hora Inicio", "Hora Fin", "Horario Completo", "Cliente Titular", "Estado"]
        ];

        ordenadas.forEach((r, idx) => {
            hojaCronograma.push([
                idx + 1,
                r.Fecha,
                r.Cancha,
                aFormato12H(aFormato24H(r.HoraInicio)),
                aFormato12H(aFormato24H(r.HoraFin)),
                `${aFormato12H(aFormato24H(r.HoraInicio))} a ${aFormato12H(aFormato24H(r.HoraFin))}`,
                r.Nombre,
                r.Estado || "Confirmada"
            ]);
        });

        const wsCronograma = XLSX.utils.aoa_to_sheet(hojaCronograma);
        wsCronograma['!cols'] = [
            { wch: 6 },   // ID
            { wch: 14 },  // Fecha
            { wch: 26 },  // Cancha
            { wch: 14 },  // Hora Inicio
            { wch: 14 },  // Hora Fin
            { wch: 22 },  // Horario Completo
            { wch: 30 },  // Cliente
            { wch: 16 }   // Estado
        ];

        // ---------------------------------------------------------
        // HOJA 3: BASE DE DATOS PLANA (Para Tablas Dinámicas)
        // ---------------------------------------------------------
        const wsBaseDatos = XLSX.utils.json_to_sheet(ordenadas.map((r, i) => ({
            "Item": i + 1,
            "Fecha": r.Fecha,
            "Cancha": r.Cancha,
            "Hora_Inicio_12H": aFormato12H(aFormato24H(r.HoraInicio)),
            "Hora_Fin_12H": aFormato12H(aFormato24H(r.HoraFin)),
            "Horario_Completo": `${aFormato12H(aFormato24H(r.HoraInicio))} a ${aFormato12H(aFormato24H(r.HoraFin))}`,
            "Cliente": r.Nombre,
            "Estado": r.Estado || "Confirmada"
        })));
        wsBaseDatos['!cols'] = [
            { wch: 8 }, { wch: 14 }, { wch: 24 }, { wch: 16 }, { wch: 16 }, { wch: 22 }, { wch: 28 }, { wch: 14 }
        ];

        // Construir el libro con las 3 pestañas
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsEjecutivo, "Reporte_Ejecutivo");
        XLSX.utils.book_append_sheet(wb, wsCronograma, "Cronograma_Maestro");
        XLSX.utils.book_append_sheet(wb, wsBaseDatos, "BaseDatos_Auditoria");

        const nombreArchivo = `Reporte_Reservas_${fechaEmision.replace(/\//g, '-')}.xlsx`;
        XLSX.writeFile(wb, nombreArchivo);
        mostrarMensaje(`📥 Archivo descargado con éxito: <strong>${nombreArchivo}</strong>`, "ok");
    }

    inicializarSelectoresHora();
    consultarDisponibilidadNube();

    // Sincronización automática continua cada 6 segundos
    setInterval(consultarDisponibilidadNube, 6000);
</script>
