<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas - Canchas Deportivas</title>
    <!-- SheetJS para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 16px;
        }
        .main-wrapper {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        @media (max-width: 950px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }
        .app-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo-container {
            width: 55px;
            height: 55px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-container img {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }
        .header h1 {
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }
        .form-control {
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
            background-color: #ffffff;
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .date-nav-bar {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .btn-nav {
            flex: 1;
            padding: 7px 4px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }
        .btn-nav:hover {
            background-color: #e2e8f0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            color: #ffffff;
            transition: opacity 0.2s;
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-primary { background-color: #2563eb; }
        .btn-success { background-color: #059669; }
        .status-msg {
            font-size: 0.85rem;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            display: none;
            line-height: 1.4;
        }
        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1.5px solid #f87171;
            display: block;
        }
        .status-ok {
            background-color: #dcfce7;
            color: #166534;
            border: 1.5px solid #86efac;
            display: block;
        }
        .cloud-badge {
            font-size: 0.75rem;
            color: #64748b;
            text-align: center;
        }

        /* Panel Comparativo Multi-Cancha */
        .schedule-header {
            background-color: #334155;
            color: #ffffff;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-header button {
            background: #475569;
            border: none;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .grid-canchas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 12px;
            padding: 16px;
            background: #f8fafc;
            max-height: 560px;
            overflow-y: auto;
        }
        .cancha-column {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cancha-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .slot-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #e2e8f0;
        }
        .slot-libre {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }
        .slot-ocupado {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        .slot-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .btn-cancel {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 4px;
            align-self: flex-start;
        }
        .btn-cancel:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- FORMULARIO -->
    <div class="app-card">
        <div class="header">
            <div class="logo-container">
                <img src="https://cdn-icons-png.flaticon.com/512/861/861512.png" alt="Logo">
            </div>
            <h1>Reservas de Canchas</h1>
        </div>

        <div class="form-body">
            <div id="statusAlert" class="status-msg"></div>

            <div class="form-group">
                <label for="txtFecha">Fecha:</label>
                <input type="date" id="txtFecha" class="form-control" onchange="cambiarFechaManual()">
                <div class="date-nav-bar">
                    <button class="btn-nav" onclick="navegarDias(-1)">◀ Ant</button>
                    <button class="btn-nav" onclick="irAHoy()">Hoy</button>
                    <button class="btn-nav" onclick="navegarDias(1)">Sig ▶</button>
                    <button class="btn-nav" onclick="navegarDias(2)">+2 Días</button>
                </div>
            </div>

            <div class="form-group">
                <label for="cboCancha">Cancha / Sede:</label>
                <select id="cboCancha" class="form-control" onchange="verificarCruceEnVivo()">
                    <option value="Cancha La Esmeralda">Cancha La Esmeralda</option>
                    <option value="Cancha San Francisco">Cancha San Francisco</option>
                    <option value="Cancha Coatepeque">Cancha Coatepeque</option>
                </select>
            </div>

            <div class="time-row">
                <div class="form-group">
                    <label for="cboHoraInicio">Desde (Inicio):</label>
                    <select id="cboHoraInicio" class="form-control" onchange="verificarCruceEnVivo()">
                        <option value="">-- Inicio --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="cboHoraFin">Hasta (Fin):</label>
                    <select id="cboHoraFin" class="form-control" onchange="verificarCruceEnVivo()">
                        <option value="">-- Fin --</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="txtNombre">Nombre del Cliente:</label>
                <input type="text" id="txtNombre" class="form-control" placeholder="Ej. Juan Pérez">
            </div>

            <div class="cloud-badge" id="lblSyncStatus">⏳ Conectando...</div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnGuardar" onclick="guardarEnGoogleDrive()">☁ Guardar Reserva</button>
                <button class="btn btn-success" onclick="descargarReporteExcel()">📥 Descargar Reporte en Excel (.xlsx)</button>
            </div>
        </div>
    </div>

    <!-- COMPARATIVO POR CANCHAS -->
    <div class="app-card">
        <div class="schedule-header">
            <span id="lblTituloHorario">Disponibilidad por Canchas</span>
            <button onclick="consultarDisponibilidadNube()">🔄 Actualizar</button>
        </div>
        <div class="grid-canchas" id="contenedorMultiCancha">
            <!-- Columnas independientes generadas por JavaScript -->
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx6yLVrzyCgpkdoAgHFbjdFEa9OEZPe2iMnoINsBGK0HcSAqXboQmHm2V4ushhGOw7v2g/exec";

    const canchasDisponibles = ["Cancha La Esmeralda", "Cancha San Francisco", "Cancha Coatepeque"];

    // Horas disponibles en formato de 24h para cálculos internos
    const horasBase = [
        "06:00", "07:00", "08:00", "09:00", "10:00", "11:00",
        "12:00", "13:00", "14:00", "15:00", "16:00", "17:00",
        "18:00", "19:00", "20:00", "21:00", "22:00"
    ];

    let reservasNube = JSON.parse(localStorage.getItem('reservas_canchas_nube')) || [];

    const inputFecha = document.getElementById('txtFecha');
    inputFecha.valueAsDate = new Date();

    // Convierte "07:00" -> "07:00 AM", "14:00" -> "02:00 PM"
    function aFormato12H(hora24) {
        if (!hora24) return "";
        let str = hora24.toString().trim();
        if (str.includes("T")) str = str.split("T")[1].substring(0, 5);
        const partes = str.split(":");
        if (partes.length >= 2) {
            let h = parseInt(partes[0], 10);
            const m = partes[1].substring(0, 2);
            const ampm = h >= 12 ? "PM" : "AM";
            h = h % 12;
            h = h ? h : 12;
            const hStr = h.toString().padStart(2, "0");
            return `${hStr}:${m} ${ampm}`;
        }
        return hora24;
    }

    // Normaliza cualquier hora a formato estándar 24H HH:MM para comparaciones exactas
    function aFormato24H(horaStr) {
        if (!horaStr) return "";
        let str = horaStr.toString().trim().toUpperCase();
        if (str.includes("AM") || str.includes("PM")) {
            const esPM = str.includes("PM");
            const limpia = str.replace("AM", "").replace("PM", "").trim();
            const partes = limpia.split(":");
            let h = parseInt(partes[0], 10);
            const m = partes[1] ? partes[1].substring(0, 2) : "00";
            if (esPM && h < 12) h += 12;
            if (!esPM && h === 12) h = 0;
            return `${h.toString().padStart(2, "0")}:${m}`;
        }
        if (str.includes("T")) str = str.split("T")[1].substring(0, 5);
        const partes = str.split(":");
        if (partes.length >= 2) {
            return `${partes[0].padStart(2, "0")}:${partes[1].substring(0, 2).padStart(2, "0")}`;
        }
        return str;
    }

    // Llenar selectores de hora en formato 12 horas
    function inicializarSelectoresHora() {
        const cboIni = document.getElementById('cboHoraInicio');
        const cboFin = document.getElementById('cboHoraFin');

        cboIni.innerHTML = '<option value="">-- Inicio --</option>';
        cboFin.innerHTML = '<option value="">-- Fin --</option>';

        horasBase.forEach((h, index) => {
            if (index < horasBase.length - 1) {
                const optIni = document.createElement('option');
                optIni.value = h;
                optIni.textContent = aFormato12H(h);
                cboIni.appendChild(optIni);
            }
            if (index > 0) {
                const optFin = document.createElement('option');
                optFin.value = h;
                optFin.textContent = aFormato12H(h);
                cboFin.appendChild(optFin);
            }
        });
    }

    function formatearFecha(fechaISO) {
        if (!fechaISO) return "";
        const partes = fechaISO.split('-');
        if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
        return fechaISO;
    }

    function navegarDias(delta) {
        let f = new Date(inputFecha.value + "T00:00:00");
        f.setDate(f.getDate() + delta);
        inputFecha.value = f.toISOString().split('T')[0];
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function irAHoy() {
        inputFecha.valueAsDate = new Date();
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function cambiarFechaManual() {
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function mostrarMensaje(texto, tipo) {
        const box = document.getElementById('statusAlert');
        box.innerHTML = texto;
        box.className = "status-msg " + (tipo === "ok" ? "status-ok" : "status-error");
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function consultarDisponibilidadNube() {
        const lbl = document.getElementById('lblSyncStatus');
        lbl.textContent = "⏳ Sincronizando con Google Drive...";

        try {
            const resp = await fetch(API_URL, { method: "GET", redirect: "follow" });
            const data = await resp.json();
            if (Array.isArray(data)) {
                reservasNube = data.map(r => ({
                    Fecha: r.Fecha || "",
                    HoraInicio: aFormato24H(r.HoraInicio),
                    HoraFin: aFormato24H(r.HoraFin),
                    Horario: `${aFormato12H(aFormato24H(r.HoraInicio))} a ${aFormato12H(aFormato24H(r.HoraFin))}`,
                    Nombre: r.Nombre || "",
                    Cancha: r.Cancha || "",
                    Estado: r.Estado || "Confirmada"
                }));
                localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
                lbl.textContent = `🟢 Conectado con Google Drive (${reservasNube.length} reservas)`;
            }
        } catch (e) {
            reservasNube = JSON.parse(localStorage.getItem('reservas_canchas_nube')) || [];
            lbl.textContent = `🟢 Conectado (${reservasNube.length} en memoria)`;
        }
        renderizarTablasMultiCancha();
    }

    function renderizarTablasMultiCancha() {
        const fecha = formatearFecha(inputFecha.value);
        const cont = document.getElementById('contenedorMultiCancha');
        document.getElementById('lblTituloHorario').textContent = `📅 Horarios: ${fecha}`;
        cont.innerHTML = "";

        canchasDisponibles.forEach(cancha => {
            const col = document.createElement('div');
            col.className = "cancha-column";
            col.innerHTML = `<div class="cancha-title">🏟️ ${cancha}</div>`;

            for (let i = 0; i < horasBase.length - 1; i++) {
                const tIni = horasBase[i];
                const tFin = horasBase[i + 1];

                const res = reservasNube.find(r => 
                    r.Fecha === fecha &&
                    r.Cancha.trim().toUpperCase() === cancha.trim().toUpperCase() &&
                    (tIni < aFormato24H(r.HoraFin) && tFin > aFormato24H(r.HoraInicio))
                );

                const item = document.createElement('div');
                if (res) {
                    item.className = "slot-item slot-ocupado";
                    item.innerHTML = `
                        <div class="slot-header-row">
                            <span><b>${aFormato12H(tIni)} - ${aFormato12H(tFin)}</b></span>
                            <span>🔴 Ocupado</span>
                        </div>
                        <div>Cliente: <b>${res.Nombre}</b></div>
                        <button class="btn-cancel" onclick="eliminarReserva('${res.Fecha}', '${res.Cancha}', '${res.HoraInicio}', '${res.Nombre}')">✕ Cancelar</button>
                    `;
                } else {
                    item.className = "slot-item slot-libre";
                    item.innerHTML = `
                        <div class="slot-header-row">
                            <span>${aFormato12H(tIni)} - ${aFormato12H(tFin)}</span>
                            <span>🟢 Libre</span>
                        </div>
                    `;
                }
                col.appendChild(item);
            }

            cont.appendChild(col);
        });
    }

    function verificarCruceEnVivo() {
        const fecha = formatearFecha(inputFecha.value);
        const horaInicio = document.getElementById('cboHoraInicio').value;
        const horaFin = document.getElementById('cboHoraFin').value;
        const cancha = document.getElementById('cboCancha').value;

        if (!fecha || !horaInicio || !horaFin || !cancha) return false;

        if (horaInicio >= horaFin) {
            mostrarMensaje("⚠️ La hora final debe ser posterior a la hora de inicio.", "error");
            return false;
        }

        const conflicto = reservasNube.find(r => {
            return (
                r.Fecha === fecha &&
                r.Cancha.trim().toUpperCase() === cancha.trim().toUpperCase() &&
                (horaInicio < aFormato24H(r.HoraFin) && horaFin > aFormato24H(r.HoraInicio))
            );
        });

        if (conflicto) {
            mostrarMensaje(`⛔ <strong>${cancha}</strong> YA ESTÁ OCUPADA de ${aFormato12H(conflicto.HoraInicio)} a ${aFormato12H(conflicto.HoraFin)} por <strong>${conflicto.Nombre}</strong>.`, "error");
            return true;
        } else {
            document.getElementById('statusAlert').style.display = "none";
            return false;
        }
    }

    async function guardarEnGoogleDrive() {
        const fecha = formatearFecha(inputFecha.value);
        const horaInicio = document.getElementById('cboHoraInicio').value;
        const horaFin = document.getElementById('cboHoraFin').value;
        const nombre = document.getElementById('txtNombre').value.trim();
        const cancha = document.getElementById('cboCancha').value;
        const btn = document.getElementById('btnGuardar');

        if (!fecha || !horaInicio || !horaFin || !nombre || !cancha) {
            mostrarMensaje("Por favor completa todos los campos.", "error");
            alert("Por favor completa todos los campos antes de guardar.");
            return;
        }

        if (horaInicio >= horaFin) {
            mostrarMensaje("La hora final debe ser posterior a la hora de inicio.", "error");
            alert("La hora final debe ser posterior a la hora de inicio.");
            return;
        }

        const hayConflicto = reservasNube.find(r => {
            return (
                r.Fecha === fecha &&
                r.Cancha.trim().toUpperCase() === cancha.trim().toUpperCase() &&
                (horaInicio < aFormato24H(r.HoraFin) && horaFin > aFormato24H(r.HoraInicio))
            );
        });

        if (hayConflicto) {
            const msj = `⚠️ LA CANCHA YA ESTÁ UTILIZADA ⚠️\n\n• Cancha: ${cancha}\n• Fecha: ${fecha}\n• Horario: ${aFormato12H(hayConflicto.HoraInicio)} a ${aFormato12H(hayConflicto.HoraFin)}\n• Cliente: ${hayConflicto.Nombre}\n\nPor favor elija otro horario.`;
            mostrarMensaje(`⛔ <strong>${cancha}</strong> ya está utilizada de ${aFormato12H(hayConflicto.HoraInicio)} a ${aFormato12H(hayConflicto.HoraFin)} por <strong>${hayConflicto.Nombre}</strong>.`, "error");
            alert(msj);
            return;
        }

        const horario12H = `${aFormato12H(horaInicio)} a ${aFormato12H(horaFin)}`;

        const nuevaReserva = {
            Fecha: fecha,
            HoraInicio: aFormato12H(horaInicio),
            HoraFin: aFormato12H(horaFin),
            Horario: horario12H,
            Nombre: nombre,
            Cancha: cancha,
            Estado: "Confirmada"
        };

        btn.disabled = true;
        btn.textContent = "Guardando...";

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(nuevaReserva)
            });

            reservasNube.push({
                Fecha: fecha,
                HoraInicio: horaInicio,
                HoraFin: horaFin,
                Horario: horario12H,
                Nombre: nombre,
                Cancha: cancha,
                Estado: "Confirmada"
            });

            localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
            renderizarTablasMultiCancha();

            document.getElementById('cboHoraInicio').value = '';
            document.getElementById('cboHoraFin').value = '';
            document.getElementById('txtNombre').value = '';

            mostrarMensaje(`¡Reserva en <strong>${cancha}</strong> guardada exitosamente (${horario12H})!`, "ok");
            alert(`¡Reserva confirmada con éxito para ${cancha} de ${horario12H}!`);
        } catch (e) {
            mostrarMensaje("Error al conectar con Google Sheets.", "error");
        } finally {
            btn.disabled = false;
            btn.textContent = "☁ Guardar Reserva";
            consultarDisponibilidadNube();
        }
    }

    async function eliminarReserva(fecha, cancha, horaInicio, nombre) {
        const hora12H = aFormato12H(horaInicio);
        if (!confirm(`¿Cancelar la reserva de "${nombre}" en ${cancha} (${fecha} a las ${hora12H})?`)) return;

        const payload = { 
            accion: "eliminar", 
            Fecha: fecha, 
            Cancha: cancha, 
            HoraInicio: aFormato24H(horaInicio)
        };

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            reservasNube = reservasNube.filter(r => !(
                r.Fecha === fecha && 
                r.Cancha.trim().toUpperCase() === cancha.trim().toUpperCase() && 
                aFormato24H(r.HoraInicio) === aFormato24H(horaInicio)
            ));
            
            localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
            renderizarTablasMultiCancha();
            mostrarMensaje("Reserva eliminada con éxito.", "ok");
        } catch (e) {
            mostrarMensaje("Error al eliminar la reserva.", "error");
        } finally {
            consultarDisponibilidadNube();
        }
    }

    function descargarReporteExcel() {
        if (reservasNube.length === 0) {
            mostrarMensaje("No hay datos para exportar.", "error");
            return;
        }

        const ordenadas = [...reservasNube].sort((a, b) => {
            const fA = a.Fecha.split('/').reverse().join('') + a.Cancha + aFormato24H(a.HoraInicio);
            const fB = b.Fecha.split('/').reverse().join('') + b.Cancha + aFormato24H(b.HoraInicio);
            return fA.localeCompare(fB);
        });

        // Hoja 1: Resumen con formato de 12 Horas
        const reporteData = [["REPORTE GENERAL DE RESERVAS POR SEDE"], []];
        const canchasUnicas = [...new Set(ordenadas.map(r => r.Cancha))];

        canchasUnicas.forEach(c => {
            reporteData.push([`🏟️ CANCHA: ${c}`]);
            reporteData.push(["Fecha", "Horario (12 Horas)", "Cliente", "Estado"]);
            
            ordenadas.filter(r => r.Cancha === c).forEach(r => {
                const h12 = `${aFormato12H(aFormato24H(r.HoraInicio))} a ${aFormato12H(aFormato24H(r.HoraFin))}`;
                reporteData.push([r.Fecha, h12, r.Nombre, r.Estado || "Confirmada"]);
            });
            reporteData.push([]);
        });

        const wsRep = XLSX.utils.aoa_to_sheet(reporteData);
        wsRep['!cols'] = [{ wch: 14 }, { wch: 22 }, { wch: 28 }, { wch: 14 }];

        // Hoja 2: Base de Datos con horas legibles en 12h
        const wsBD = XLSX.utils.json_to_sheet(ordenadas.map(r => ({
            "Fecha": r.Fecha,
            "Hora Inicio": aFormato12H(aFormato24H(r.HoraInicio)),
            "Hora Fin": aFormato12H(aFormato24H(r.HoraFin)),
            "Horario": `${aFormato12H(aFormato24H(r.HoraInicio))} a ${aFormato12H(aFormato24H(r.HoraFin))}`,
            "Nombre": r.Nombre,
            "Cancha": r.Cancha,
            "Estado": r.Estado || "Confirmada"
        })));

        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsRep, "Reporte_Sedes");
        XLSX.utils.book_append_sheet(wb, wsBD, "BaseDatos");

        XLSX.writeFile(wb, "Reporte_Reservas_MultiSede.xlsx");
        mostrarMensaje("Archivo Excel descargado exitosamente.", "ok");
    }

    inicializarSelectoresHora();
    consultarDisponibilidadNube();
</script>
