<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas Multi-Cancha</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px;
        }
        .main-wrapper {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }
        @media (max-width: 900px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }
        }
        .app-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #1e293b;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .logo-container {
            width: 55px;
            height: 55px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-container img {
            max-width: 75%;
            max-height: 75%;
            object-fit: contain;
        }
        .header h1 {
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }
        .form-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .time-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #475569;
        }
        .form-control {
            padding: 9px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.88rem;
            outline: none;
            width: 100%;
        }
        .form-control:focus {
            border-color: #2563eb;
        }
        .date-nav-bar {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .btn-nav {
            flex: 1;
            padding: 5px 6px;
            background-color: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }
        .btn {
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            color: #ffffff;
        }
        .btn:disabled {
            opacity: 0.6;
        }
        .btn-primary { background-color: #2563eb; }
        .btn-success { background-color: #059669; }
        .status-msg {
            font-size: 0.82rem;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            display: none;
        }
        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
            display: block;
        }
        .status-ok {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
            display: block;
        }
        .cloud-badge {
            font-size: 0.72rem;
            color: #64748b;
            text-align: center;
        }

        /* Panel Comparativo Multi-Cancha */
        .schedule-header {
            background-color: #334155;
            color: #ffffff;
            padding: 14px 18px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .schedule-header button {
            background: #475569;
            border: none;
            color: #ffffff;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .grid-canchas {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 12px;
            padding: 16px;
            background: #f8fafc;
            max-height: 540px;
            overflow-y: auto;
        }
        .cancha-column {
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cancha-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #1e293b;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .slot-item {
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border: 1px solid #e2e8f0;
        }
        .slot-libre {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
            color: #15803d;
        }
        .slot-ocupado {
            background-color: #fef2f2;
            border-color: #fecaca;
            color: #991b1b;
        }
        .slot-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .btn-cancel {
            background: #ef4444;
            color: white;
            border: none;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.68rem;
            cursor: pointer;
            margin-top: 2px;
            align-self: flex-start;
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- PANEL 1: FORMULARIO -->
    <div class="app-card">
        <div class="header">
            <div class="logo-container">
                <img src="https://cdn-icons-png.flaticon.com/512/861/861512.png" alt="Logo">
            </div>
            <h1>Reservas de Canchas</h1>
        </div>

        <div class="form-body">
            <div id="statusAlert" class="status-msg"></div>

            <div class="form-group">
                <label for="txtFecha">Fecha:</label>
                <input type="date" id="txtFecha" class="form-control" onchange="cambiarFechaManual()">
                <div class="date-nav-bar">
                    <button class="btn-nav" onclick="navegarDias(-1)">◀ Ant</button>
                    <button class="btn-nav" onclick="irAHoy()">Hoy</button>
                    <button class="btn-nav" onclick="navegarDias(1)">Sig ▶</button>
                    <button class="btn-nav" onclick="navegarDias(2)">+2 Días</button>
                </div>
            </div>

            <div class="form-group">
                <label for="cboCancha">Cancha / Ubicación:</label>
                <select id="cboCancha" class="form-control" onchange="verificarCruceEnVivo()">
                    <option value="Cancha Sede Norte">Cancha Sede Norte</option>
                    <option value="Cancha Sede Sur">Cancha Sede Sur</option>
                    <option value="Cancha Sintética">Cancha Sintética</option>
                </select>
            </div>

            <div class="time-row">
                <div class="form-group">
                    <label for="txtHoraInicio">Desde:</label>
                    <input type="time" id="txtHoraInicio" class="form-control" onchange="verificarCruceEnVivo()">
                </div>
                <div class="form-group">
                    <label for="txtHoraFin">Hasta:</label>
                    <input type="time" id="txtHoraFin" class="form-control" onchange="verificarCruceEnVivo()">
                </div>
            </div>

            <div class="form-group">
                <label for="txtNombre">Nombre del Cliente:</label>
                <input type="text" id="txtNombre" class="form-control" placeholder="Ej. Juan Pérez">
            </div>

            <div class="cloud-badge" id="lblSyncStatus">⏳ Conectando...</div>

            <div class="btn-group">
                <button class="btn btn-primary" id="btnGuardar" onclick="guardarEnGoogleDrive()">☁ Guardar Reserva</button>
                <button class="btn btn-success" onclick="descargarReporteExcel()">📥 Descargar Excel (.xlsx)</button>
            </div>
        </div>
    </div>

    <!-- PANEL 2: COMPARATIVO POR CANCHAS EN PARALELO -->
    <div class="app-card">
        <div class="schedule-header">
            <span id="lblTituloHorario">Disponibilidad por Canchas</span>
            <button onclick="consultarDisponibilidadNube()">🔄 Actualizar</button>
        </div>
        <div class="grid-canchas" id="contenedorMultiCancha">
            <!-- Se generan columnas independientes por cancha -->
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx6yLVrzyCgpkdoAgHFbjdFEa9OEZPe2iMnoINsBGK0HcSAqXboQmHm2V4ushhGOw7v2g/exec";

    // Lista de canchas disponibles
    const canchasDisponibles = ["Cancha Sede Norte", "Cancha Sede Sur", "Cancha Sintética"];

    const turnosBase = [
        { ini: "06:00", fin: "07:00" }, { ini: "07:00", fin: "08:00" },
        { ini: "08:00", fin: "09:00" }, { ini: "09:00", fin: "10:00" },
        { ini: "10:00", fin: "11:00" }, { ini: "11:00", fin: "12:00" },
        { ini: "12:00", fin: "13:00" }, { ini: "13:00", fin: "14:00" },
        { ini: "14:00", fin: "15:00" }, { ini: "15:00", fin: "16:00" },
        { ini: "16:00", fin: "17:00" }, { ini: "17:00", fin: "18:00" },
        { ini: "18:00", fin: "19:00" }, { ini: "19:00", fin: "20:00" },
        { ini: "20:00", fin: "21:00" }, { ini: "21:00", fin: "22:00" }
    ];

    let reservasNube = JSON.parse(localStorage.getItem('reservas_canchas_nube')) || [];

    const inputFecha = document.getElementById('txtFecha');
    inputFecha.valueAsDate = new Date();

    function formatearFecha(fechaISO) {
        if (!fechaISO) return "";
        const partes = fechaISO.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function navegarDias(delta) {
        let f = new Date(inputFecha.value + "T00:00:00");
        f.setDate(f.getDate() + delta);
        inputFecha.value = f.toISOString().split('T')[0];
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function irAHoy() {
        inputFecha.valueAsDate = new Date();
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function cambiarFechaManual() {
        renderizarTablasMultiCancha();
        verificarCruceEnVivo();
    }

    function mostrarMensaje(texto, tipo) {
        const box = document.getElementById('statusAlert');
        box.innerHTML = texto;
        box.className = "status-msg " + (tipo === "ok" ? "status-ok" : "status-error");
    }

    async function consultarDisponibilidadNube() {
        const lbl = document.getElementById('lblSyncStatus');
        lbl.textContent = "⏳ Sincronizando...";

        try {
            const resp = await fetch(API_URL, { method: "GET", redirect: "follow" });
            const data = await resp.json();
            if (Array.isArray(data)) {
                reservasNube = data;
                localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
                lbl.textContent = `🟢 Conectado (${reservasNube.length} reservas)`;
            }
        } catch (e) {
            reservasNube = JSON.parse(localStorage.getItem('reservas_canchas_nube')) || [];
            lbl.textContent = `🟢 Conectado (${reservasNube.length} en memoria)`;
        }
        renderizarTablasMultiCancha();
    }

    // Renderiza cada cancha en una columna separada
    function renderizarTablasMultiCancha() {
        const fecha = formatearFecha(inputFecha.value);
        const cont = document.getElementById('contenedorMultiCancha');
        document.getElementById('lblTituloHorario').textContent = `📅 Horarios para el día: ${fecha}`;
        cont.innerHTML = "";

        canchasDisponibles.forEach(cancha => {
            const col = document.createElement('div');
            col.className = "cancha-column";
            col.innerHTML = `<div class="cancha-title">🏟️ ${cancha}</div>`;

            turnosBase.forEach(t => {
                const res = reservasNube.find(r => 
                    r.Fecha === fecha &&
                    r.Cancha.toUpperCase() === cancha.toUpperCase() &&
                    (t.ini < r.HoraFin && t.fin > r.HoraInicio)
                );

                const item = document.createElement('div');
                if (res) {
                    item.className = "slot-item slot-ocupado";
                    item.innerHTML = `
                        <div class="slot-header-row">
                            <span><b>${t.ini} - ${t.fin}</b></span>
                            <span>🔴 Ocupado</span>
                        </div>
                        <div>Cliente: <b>${res.Nombre}</b></div>
                        <button class="btn-cancel" onclick="eliminarReserva('${res.Fecha}', '${res.Cancha}', '${res.HoraInicio}', '${res.Nombre}')">✕ Cancelar</button>
                    `;
                } else {
                    item.className = "slot-item slot-libre";
                    item.innerHTML = `
                        <div class="slot-header-row">
                            <span>${t.ini} - ${t.fin}</span>
                            <span>🟢 Libre</span>
                        </div>
                    `;
                }
                col.appendChild(item);
            });

            cont.appendChild(col);
        });
    }

    function verificarCruceEnVivo() {
        const fecha = formatearFecha(inputFecha.value);
        const horaInicio = document.getElementById('txtHoraInicio').value;
        const horaFin = document.getElementById('txtHoraFin').value;
        const cancha = document.getElementById('cboCancha').value;

        if (!fecha || !horaInicio || !horaFin || !cancha) return;

        if (horaInicio >= horaFin) {
            mostrarMensaje("⚠️ La hora final debe ser mayor a la hora inicial.", "error");
            return;
        }

        const conflicto = reservasNube.find(r => 
            r.Fecha === fecha &&
            r.Cancha.toUpperCase() === cancha.toUpperCase() &&
            (horaInicio < r.HoraFin && horaFin > r.HoraInicio)
        );

        if (conflicto) {
            mostrarMensaje(`⛔ <strong>${cancha}</strong> ya está ocupada de ${conflicto.HoraInicio} a ${conflicto.HoraFin} por <strong>${conflicto.Nombre}</strong>.`, "error");
        } else {
            document.getElementById('statusAlert').style.display = "none";
        }
    }

    async function guardarEnGoogleDrive() {
        const fecha = formatearFecha(inputFecha.value);
        const horaInicio = document.getElementById('txtHoraInicio').value;
        const horaFin = document.getElementById('txtHoraFin').value;
        const nombre = document.getElementById('txtNombre').value.trim();
        const cancha = document.getElementById('cboCancha').value;
        const btn = document.getElementById('btnGuardar');

        if (!fecha || !horaInicio || !horaFin || !nombre || !cancha) {
            mostrarMensaje("Por favor completa todos los campos.", "error");
            return;
        }

        if (horaInicio >= horaFin) {
            mostrarMensaje("La hora final debe ser mayor que la de inicio.", "error");
            return;
        }

        const conflicto = reservasNube.find(r => 
            r.Fecha === fecha &&
            r.Cancha.toUpperCase() === cancha.toUpperCase() &&
            (horaInicio < r.HoraFin && horaFin > r.HoraInicio)
        );

        if (conflicto) {
            mostrarMensaje(`⛔ Horario no disponible en ${cancha}.`, "error");
            return;
        }

        const nuevaReserva = {
            Fecha: fecha,
            HoraInicio: horaInicio,
            HoraFin: horaFin,
            Horario: `${horaInicio} a ${horaFin}`,
            Nombre: nombre,
            Cancha: cancha,
            Estado: "Confirmada"
        };

        btn.disabled = true;
        btn.textContent = "Guardando...";

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(nuevaReserva)
            });

            reservasNube.push(nuevaReserva);
            localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
            renderizarTablasMultiCancha();

            document.getElementById('txtHoraInicio').value = '';
            document.getElementById('txtHoraFin').value = '';
            document.getElementById('txtNombre').value = '';

            mostrarMensaje(`¡Reserva en <strong>${cancha}</strong> guardada exitosamente!`, "ok");
        } catch (e) {
            mostrarMensaje("Error al conectar.", "error");
        } finally {
            btn.disabled = false;
            btn.textContent = "☁ Guardar Reserva";
            consultarDisponibilidadNube();
        }
    }

    async function eliminarReserva(fecha, cancha, horaInicio, nombre) {
        if (!confirm(`¿Cancelar la reserva de "${nombre}" en ${cancha} (${fecha})?`)) return;

        const payload = { accion: "eliminar", Fecha: fecha, Cancha: cancha, HoraInicio: horaInicio };

        try {
            await fetch(API_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload)
            });

            reservasNube = reservasNube.filter(r => !(
                r.Fecha === fecha && 
                r.Cancha.toUpperCase() === cancha.toUpperCase() && 
                r.HoraInicio === horaInicio
            ));
            
            localStorage.setItem('reservas_canchas_nube', JSON.stringify(reservasNube));
            renderizarTablasMultiCancha();
            mostrarMensaje("Reserva eliminada con éxito.", "ok");
        } catch (e) {
            mostrarMensaje("Error al eliminar.", "error");
        } finally {
            consultarDisponibilidadNube();
        }
    }

    function descargarReporteExcel() {
        if (reservasNube.length === 0) {
            mostrarMensaje("No hay datos para exportar.", "error");
            return;
        }

        const ordenadas = [...reservasNube].sort((a, b) => {
            const fA = a.Fecha.split('/').reverse().join('') + a.Cancha + a.HoraInicio;
            const fB = b.Fecha.split('/').reverse().join('') + b.Cancha + b.HoraInicio;
            return fA.localeCompare(fB);
        });

        const wsBD = XLSX.utils.json_to_sheet(ordenadas);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, wsBD, "BaseDatos");
        XLSX.writeFile(wb, "Reporte_MultiCanchas.xlsx");
    }

    consultarDisponibilidadNube();
</script>

</body>
</html>
